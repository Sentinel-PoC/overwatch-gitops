---
# OPS-897 Phase B — ExternalSecret for Alertmanager bot token migration
#
# Purpose: Migrate the Telegram bot token from inline (hardcoded in the
# alertmanager-main secret) to Vault-sourced via ESO, so the config can be
# re-rendered without the token appearing in git history or session logs.
#
# Additionally enables the Watchdog heartbeat receiver: the Watchdog alert
# (which ALWAYS fires in Prometheus, by design) is now routed to Telegram
# with repeat_interval 6h. This proves the Prometheus → Alertmanager →
# Telegram path is alive. Four Telegram heartbeats per day are expected;
# silence indicates a pipeline problem.
#
# NOTE: This ExternalSecret uses ESO spec.target.template to render the
# FULL alertmanager.yaml content, pulling bot_token + chat_id from Vault.
# The telegram.tmpl key is also included as a static template (no secrets).
#
# Go template escaping: Alertmanager message templates use {{ }} syntax.
# ESO also uses {{ }} for substitution. Alertmanager-specific {{ }} are
# wrapped in Go raw strings (backticks) inside ESO template actions so ESO
# passes them through literally to the rendered output.
#
# ClusterSecretStore: vault-backend (apps/external-secrets/cluster-secret-store.yaml)
# Vault path: secret/telegram/alertmanager-bot (keys: bot_token, chat_id)
#
# Safety:
#   creationPolicy: Merge — will update existing alertmanager-main secret
#   deletionPolicy: Retain — deleting this ExternalSecret leaves the secret intact
#   mergePolicy: Merge — only the keys defined here are updated; other keys untouched
#
# Phase A config preserved exactly; only additions are:
#   - bot_token now sourced from Vault instead of inline
#   - Watchdog receiver gets telegram_configs with heartbeat message
#   - Watchdog route gets explicit repeat_interval: 6h
#
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-main
  namespace: openshift-monitoring
  labels:
    app.kubernetes.io/name: alertmanager-main-externalsecret
    app.kubernetes.io/part-of: monitoring-overrides
    ops.overwatch/issue: OPS-897
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: alertmanager-main
    creationPolicy: Merge
    deletionPolicy: Retain
    template:
      mergePolicy: Merge
      data:
        alertmanager.yaml: |
          "global":
            "http_config":
              "proxy_from_environment": true
            "resolve_timeout": "5m"
          "inhibit_rules":
          - "equal":
            - "namespace"
            - "alertname"
            "source_matchers":
            - "severity = critical"
            "target_matchers":
            - "severity =~ warning|info"
          - "equal":
            - "namespace"
            - "alertname"
            "source_matchers":
            - "severity = warning"
            "target_matchers":
            - "severity = info"
          "receivers":
          - "name": "Default"
            "telegram_configs":
            - "bot_token": "{{ .bot_token }}"
              "chat_id": {{ .chat_id }}
              "api_url": "https://api.telegram.org"
              "parse_mode": "HTML"
              "message": '{{ `{{ template "telegram.default" . }}` }}'
              "send_resolved": true
          - "name": "Watchdog"
            "telegram_configs":
            - "bot_token": "{{ .bot_token }}"
              "chat_id": {{ .chat_id }}
              "api_url": "https://api.telegram.org"
              "parse_mode": "HTML"
              "message": "✅ Alerting pipeline alive (Watchdog heartbeat)"
              "send_resolved": false
          - "name": "Critical"
            "telegram_configs":
            - "bot_token": "{{ .bot_token }}"
              "chat_id": {{ .chat_id }}
              "api_url": "https://api.telegram.org"
              "parse_mode": "HTML"
              "message": '{{ `{{ template "telegram.default" . }}` }}'
              "send_resolved": true
          "templates":
          - "/etc/alertmanager/config/*.tmpl"
          "route":
            "group_by":
            - "namespace"
            - "alertname"
            "group_interval": "5m"
            "group_wait": "30s"
            "receiver": "Default"
            "repeat_interval": "12h"
            "routes":
            - "matchers":
              - "alertname = Watchdog"
              "receiver": "Watchdog"
              "repeat_interval": "6h"
            - "matchers":
              - "severity = critical"
              "receiver": "Critical"
              "continue": false
        telegram.tmpl: |
          {{ `{{ define "telegram.default" -}}
          {{ if eq .Status "firing" }}🔥 <b>FIRING</b>{{ else }}✅ <b>RESOLVED</b>{{ end }} ({{ .Alerts | len }})
          {{ range .Alerts -}}
          <b>{{ .Labels.alertname }}</b> [{{ .Labels.severity }}]
          {{ if .Labels.namespace }}ns: <code>{{ .Labels.namespace }}</code>
          {{ end -}}
          {{ if .Annotations.summary }}{{ .Annotations.summary }}
          {{ end -}}
          {{ if .Annotations.description }}{{ .Annotations.description }}
          {{ end -}}
          ---
          {{ end -}}
          {{- end }}` }}
  data:
    - secretKey: bot_token
      remoteRef:
        key: telegram/alertmanager-bot
        property: bot_token
    - secretKey: chat_id
      remoteRef:
        key: telegram/alertmanager-bot
        property: chat_id

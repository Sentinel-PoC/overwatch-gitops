apiVersion: v1
kind: Secret
metadata:
  name: arch-vault-reader-token
  namespace: openshift-gitops
  annotations:
    # OKD/K8s auto-populates .data.token with a long-lived SA token
    # when the secret type is service-account-token.
    kubernetes.io/service-account.name: arch-vault-reader
type: kubernetes.io/service-account-token

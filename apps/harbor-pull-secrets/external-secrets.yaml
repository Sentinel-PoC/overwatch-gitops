# OPS-1088: logging namespace needs harbor-pull-secret after OPS-1073 repointed
# alloy + victoria-logs from public docker.io/ghcr images to private harbor.208.haist.farm/sentinel/*.
# Previously logging only pulled public images so it was not in the SEC-82 18-namespace distribution.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: harbor-pull-secret
  namespace: logging
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: harbor-pull-secret
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "harbor.208.haist.farm": {
                "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef:
        key: harbor/robot-pull
        property: username
    - secretKey: password
      remoteRef:
        key: harbor/robot-pull
        property: password
---
# OPS-1106: observability namespace needs harbor-pull-secret — tempo-0 gets
# ImagePullBackOff ("unauthorized to access repository: sentinel/tempo") because
# harbor.208.haist.farm/sentinel/ requires auth and this namespace had no pull credential.
# The observability namespace pre-exists with argocd.argoproj.io/managed-by label
# (apps/jaeger/namespace-observability.yaml, OPS-396).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: harbor-pull-secret
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: harbor-pull-secret
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "harbor.208.haist.farm": {
                "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef:
        key: harbor/robot-pull
        property: username
    - secretKey: password
      remoteRef:
        key: harbor/robot-pull
        property: password

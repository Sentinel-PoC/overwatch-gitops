---
# OPS-624: mirror-pull-secret for kyverno namespace
# Provides Kyverno with credentials to pull images (and verify cosign signatures)
# from mirror.208.haist.farm:8443 when the verify-image-signatures policy checks
# the mirror fallback imageReference (mirror.208.haist.farm:8443/sentinel/*).
# SEC-97: migrated from admin credential to pull-only robot (sentinel+pull-robot).
# Vault path: secret/mirror-registry/pull-robot (username: sentinel+pull-robot)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mirror-pull-secret
  namespace: kyverno
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: mirror-pull-secret
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "mirror.208.haist.farm:8443": {
                "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef:
        key: mirror-registry/pull-robot
        property: username
    - secretKey: password
      remoteRef:
        key: mirror-registry/pull-robot
        property: password

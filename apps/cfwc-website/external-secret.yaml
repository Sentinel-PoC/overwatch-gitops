---
# Loads the Anthropic API key from Vault and surfaces it to the cfwc-website
# pods as the env var CW_ANTHROPIC_API_KEY (consumed by backend/config.py).
#
# Operator must populate Vault before this app comes up Healthy:
#   vault kv put secret/cfwc/anthropic api_key="sk-ant-..."
#
# If the path is missing the External Secrets Operator surfaces a
# SecretSyncedError; the deployment will hold (envFrom on a missing
# Secret blocks pod creation) until Vault is populated. That's the
# intended fail-loud behavior.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cfwc-website-credentials
  namespace: cfwc-website
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: cfwc-website-credentials
    creationPolicy: Owner
  data:
    - secretKey: CW_ANTHROPIC_API_KEY
      remoteRef:
        key: cfwc/anthropic
        property: api_key

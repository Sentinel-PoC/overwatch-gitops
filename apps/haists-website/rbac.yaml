---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: haists-website
  namespace: haists-website
---
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: haists-website-anyuid
# Explicit hardening (was previously relying on OKD-fill defaults which set
# allowPrivilegeEscalation=true, prompting an ignoreDifferences mask in the
# ArgoCD Application — see SEC-33).
allowPrivilegedContainer: false
allowPrivilegeEscalation: false
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowedCapabilities: []
defaultAddCapabilities: []
readOnlyRootFilesystem: false
requiredDropCapabilities:
  - ALL
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: MustRunAs
fsGroup:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
groups: []
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - persistentVolumeClaim
  - projected
  - secret
users:
  - system:serviceaccount:haists-website:haists-website
priority: 10

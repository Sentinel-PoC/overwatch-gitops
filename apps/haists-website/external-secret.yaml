---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: haists-website-credentials
  namespace: haists-website
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: haists-website-credentials
    creationPolicy: Owner
  data:
    - secretKey: HW_OIDC_CLIENT_SECRET
      remoteRef:
        key: authentik/clients/haists-website
        property: client_secret
    - secretKey: HW_OIDC_CLIENT_ID
      remoteRef:
        key: authentik/clients/haists-website
        property: client_id
    - secretKey: HW_CONTACT_RECIPIENT_EMAIL
      remoteRef:
        key: haists-website
        property: contact_recipient_email
    - secretKey: HW_MAILJET_API_KEY
      remoteRef:
        key: mailjet
        property: api_key
    - secretKey: HW_MAILJET_SECRET_KEY
      remoteRef:
        key: mailjet
        property: secret_key

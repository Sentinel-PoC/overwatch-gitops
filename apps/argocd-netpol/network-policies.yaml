# SEC-85: NetworkPolicy for the openshift-gitops namespace.
#
# Phase 1 (merged): Egress least-privilege (argocd-default-deny-egress +
#   argocd-allow-egress). See original commit for rationale.
#
# Phase 2 (this PR): Ingress default-deny (argocd-default-deny-ingress).
#   The ArgoCD operator manages six per-component Ingress NPs that already
#   explicitly allow exactly the traffic each component needs:
#     - openshift-gitops-application-controller-network-policy (port 8082)
#     - openshift-gitops-dex-server-network-policy (5556/5557/5558)
#     - openshift-gitops-redis-network-policy (6379)
#     - openshift-gitops-redis-ha-network-policy (6379/26379 HA — not currently used)
#     - openshift-gitops-repo-server-network-policy (8081/8084)
#     - openshift-gitops-server-network-policy (all ports — user-facing)
#
# AUDIT RESULT (2026-06-04): All 5 running pods in openshift-gitops have an
# ingress NP that selects them and whitelists their container ports. No pod
# is UNCOVERED. It is therefore safe to add default-deny-ingress.
#
#   openshift-gitops-application-controller-0
#     container: 8082/TCP  → covered (port 8082 from any namespace)
#   openshift-gitops-dex-server
#     container: 5556/5557 → covered (from argocd-server pod)
#     container: 5558/TCP  → covered (from any namespace / metrics)
#   openshift-gitops-redis
#     container: 6379/TCP  → covered (from app-ctrl/repo-server/server)
#   openshift-gitops-repo-server
#     container: 8081/TCP  → covered (from app-ctrl/server/notifications/appset)
#     container: 8084/TCP  → covered (from any namespace / metrics)
#   openshift-gitops-server
#     container: 8080/TCP  → covered (allow-all: from=[], ports=[])
#     container: 8083/TCP  → covered (allow-all: from=[], ports=[])
#
# JUDGE LIVE VERIFICATION REQUIRED post-merge:
#   1. ArgoCD UI must be reachable at https://openshift-gitops-server-openshift-gitops...
#   2. At least one ArgoCD Application must complete a sync cycle successfully
#   3. Auto-sync fires within ~5 minutes of merge; if either check fails,
#      delete the argocd-default-deny-ingress NP immediately:
#      `oc delete networkpolicy argocd-default-deny-ingress -n openshift-gitops`
#
# LIVE STATE (verified 2026-05-30 per planner PLAN comment on SEC-85):
#   - Only managed cluster: in-cluster (https://kubernetes.default.svc)
#   - Forgejo repo URL resolves to 192.168.12.168 (Pangolin VIP — serves both
#     forgejo.208.haist.farm and auth-next.208.haist.farm)
#   - ESO (external-secrets namespace) handles Vault calls; argocd pods do NOT
#     directly reach Vault. No .206:8200 rule needed.
#   - kube-API masters: 10.0.0.221/222/223 (covered by 10.0.0.220/30, OPS-292 precedent)
#   - Service network: 172.30.0.0/16 at :443 (kubernetes.default.svc)
#   - Pod network: 10.128.0.0/14 (OKD clusterNetwork, hostPrefix 23)
#
# ROLLBACK: NetworkPolicy is stateless. Delete NP to instantly restore
# default-allow-ingress:
#   `oc delete networkpolicy argocd-default-deny-ingress -n openshift-gitops`
---
# Egress default-deny for all pods in openshift-gitops.
# Ingress is intentionally omitted — operator-managed policies handle it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argocd-default-deny-egress
  namespace: openshift-gitops
  labels:
    security.sentinel/layer: network-policy
    security.sentinel/type: default-deny
    security.sentinel/issue: SEC-85
spec:
  podSelector: {}
  policyTypes:
    - Egress
---
# Explicit egress allow-set for ArgoCD control-plane pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argocd-allow-egress
  namespace: openshift-gitops
  labels:
    security.sentinel/layer: network-policy
    security.sentinel/issue: SEC-85
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # DNS — cluster DNS in all namespaces (required for all name resolution)
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
        - port: 5353
          protocol: UDP
        - port: 5353
          protocol: TCP

    # kube-API via service network (kubernetes.default.svc → 172.30.0.0/16 :443)
    - to:
        - ipBlock:
            cidr: 172.30.0.0/16
      ports:
        - port: 443
          protocol: TCP

    # kube-API via master node IPs — 10.0.0.220/30 covers masters 221/222/223
    # (OPS-292 precedent; same /30 used in sentinel-ops etcd-backup policy)
    - to:
        - ipBlock:
            cidr: 10.0.0.220/30
      ports:
        - port: 6443
          protocol: TCP

    # Pod network — intra-namespace controller↔redis↔repo-server↔dex traffic
    # AND application-controller reach to managed workload pods (local cluster only)
    # OKD clusterNetwork: 10.128.0.0/14, hostPrefix 23
    - to:
        - ipBlock:
            cidr: 10.128.0.0/14
      ports: []

    # Ingress VIP 192.168.12.168 — serves BOTH:
    #   forgejo.208.haist.farm (repo-server git clone over HTTPS)
    #   auth-next.208.haist.farm (dex OIDC issuer for Authentik)
    # Both DNS names resolve to .168 (Pangolin VIP). One ipBlock covers both.
    - to:
        - ipBlock:
            cidr: 192.168.12.168/32
      ports:
        - port: 443
          protocol: TCP
---
# SEC-85 Phase 2: Ingress default-deny for all pods in openshift-gitops.
#
# This policy makes the six operator-managed per-component ingress NPs
# effective: without a default-deny-ingress, those NPs have no baseline
# to restrict against (all ingress is implicitly allowed regardless).
#
# The operator-managed NPs were verified to cover all five running pods
# and all their container ports before this policy was added (see audit
# in the header of this file).
#
# ROLLBACK: `oc delete networkpolicy argocd-default-deny-ingress -n openshift-gitops`
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argocd-default-deny-ingress
  namespace: openshift-gitops
  labels:
    security.sentinel/layer: network-policy
    security.sentinel/type: default-deny
    security.sentinel/issue: SEC-85
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
# ExternalSecret — Tempo MinIO credentials
# Reads from Vault secret/data/tempo/minio-creds
# Creates K8s Secret tempo-minio-creds in namespace observability
#
# OPS-519: Tempo S3 backend migration from Jaeger in-memory.
# Credential pattern mirrors Loki (apps/loki/external-secret.yaml / OPS-399):
#   Vault → ESO → K8s Secret → extraEnvFrom → AWS SDK env-chain
#
# Pre-deploy operator actions required:
#   1. Create MinIO bucket: mc mb myminio/tempo-traces
#   2. Write Vault secret:
#        vault kv put secret/tempo/minio-creds \
#          access_key=<key> secret_key=<secret>
# Vault fields: access_key, secret_key
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tempo-minio-creds
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: tempo-minio-creds
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: tempo/minio-creds
        property: access_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: tempo/minio-creds
        property: secret_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

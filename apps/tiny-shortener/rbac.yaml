---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tiny-shortener
  namespace: tiny-shortener
---
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: tiny-shortener-anyuid
allowPrivilegedContainer: false
allowPrivilegeEscalation: false
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowedCapabilities: []
defaultAddCapabilities: []
readOnlyRootFilesystem: false
requiredDropCapabilities:
  - ALL
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: MustRunAs
fsGroup:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - persistentVolumeClaim
  - projected
  - secret
groups: []
users:
  - system:serviceaccount:tiny-shortener:tiny-shortener

---
# OPS-1210: Harbor pull credential for the private sentinel/tiny-shortener image.
# tiny-shortener is not in the inject-harbor-pull-secret ClusterPolicy namespace
# list, so the deployment references this secret directly via imagePullSecrets.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: harbor-pull-secret
  namespace: tiny-shortener
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: harbor-pull-secret
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "harbor.208.haist.farm": {
                "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef:
        key: harbor/robot-pull
        property: username
    - secretKey: password
      remoteRef:
        key: harbor/robot-pull
        property: password

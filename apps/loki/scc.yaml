---
# OKD anyuid SCC binding — Loki chart containers run as UID 10001
# which falls outside the default restricted namespace UID range.
#
# OPS-397: Changed from ClusterRoleBinding to namespace-scoped RoleBinding.
# The cluster's SCC admission controller does not honour ClusterRoleBinding
# to system:openshift:scc:anyuid for SAs in the observability namespace
# (confirmed by judge post-merge verification — pods failed with
# "must be in the ranges: [1000830000, 1000839999]").
# Namespace-scoped RoleBinding is evaluated more reliably on this OKD build.
# If RoleBinding is also ineffective, escalate to operator for direct
# SCC .users patch (oc adm policy add-scc-to-user anyuid -z loki -n observability).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loki-anyuid-scc
  namespace: observability
subjects:
  - kind: ServiceAccount
    name: loki
    namespace: observability
  - kind: ServiceAccount
    name: default
    namespace: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid

---
# ExternalSecret — Loki MinIO credentials
# Reads from Vault secret/data/loki/minio-creds
# Creates K8s Secret loki-minio-creds in namespace observability
#
# OPS-399: Keys renamed to AWS SDK standard env var names
# (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY) so Loki's S3 client
# credential provider chain picks them up automatically without needing
# explicit credentials in the Loki config or -config.expand-env flag.
# Credential flow: Vault → ESO → K8s Secret → extraEnvFrom → AWS SDK env chain.
#
# Pre-deploy: Vault path written by loki-worker (OPS-391)
# Vault fields: access_key, secret_key, endpoint, bucket
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: loki-minio-creds
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: loki-minio-creds
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: loki/minio-creds
        property: access_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: loki/minio-creds
        property: secret_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

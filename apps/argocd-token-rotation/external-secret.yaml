# OPS-1005: ExternalSecret for ArgoCD token rotation CronJob credentials.
# Updated from OPS-1003 to use AppRole auth instead of a period Vault token.
#
# Reads from Vault secret/argocd-token-rotation (KV v2) via the platform's
# ClusterSecretStore vault-backend (Kubernetes auth, role external-secrets).
#
# Three fields are required (operator must populate before first sync; see
# namespace.yaml for the setup commands):
#   argocd_admin_password  — ArgoCD admin account plaintext password
#                            (from openshift-gitops-cluster secret)
#   role_id                — Vault AppRole role_id for argocd-token-rotation
#   secret_id              — Vault AppRole secret_id for argocd-token-rotation
#
# At runtime, the CronJob script authenticates to Vault via:
#   POST /v1/auth/approle/login role_id=... secret_id=...
# receiving a short-lived token (TTL=10m, max_ttl=15m) used only for that run.
# No long-lived Vault token is stored → no 768h max_ttl cap, no silent expiry.
#
# The resulting K8s Secret (argocd-rotation-credentials) is mounted by the
# CronJob as environment variables:
#   ARGOCD_ADMIN_PASSWORD → argocd_admin_password
#   VAULT_ROLE_ID         → role_id
#   VAULT_SECRET_ID       → secret_id
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-rotation-credentials
  namespace: argocd-token-rotation
  labels:
    app.kubernetes.io/part-of: argocd-token-rotation
    ops.overwatch/issue: OPS-1005
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: argocd-rotation-credentials
    creationPolicy: Owner
  data:
    - secretKey: ARGOCD_ADMIN_PASSWORD
      remoteRef:
        key: argocd-token-rotation
        property: argocd_admin_password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: VAULT_ROLE_ID
      remoteRef:
        key: argocd-token-rotation
        property: role_id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: VAULT_SECRET_ID
      remoteRef:
        key: argocd-token-rotation
        property: secret_id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

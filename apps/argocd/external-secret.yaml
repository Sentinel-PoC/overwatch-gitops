---
# ExternalSecret: materialize argocd-authentik-oidc Secret in openshift-gitops namespace.
#
# ArgoCD Dex config references this secret as $argocd-authentik-oidc:clientSecret
# (ArgoCD dex.config secret ref syntax: $<secret-name>:<data-key>).
#
# This Secret is used by the dex.config stanza in the ArgoCD CR spec.sso.dex.config
# (see argocd-cr-sso-patch.yaml for the correct CR-based approach documented in OPS-650).
#
# Vault path: secret/authentik/clients/argocd
#   client_id:     HFFjxXWDagCiiEapBfJLgDGEVB7mfoiKOELtBKu1  (safe to log)
#   client_secret: (redacted -- held in Vault only)
#
# Authentik application: argocd (slug)
#   Redirect URIs:
#     https://argocd.208.haist.farm/auth/callback       (native OIDC, unused -- removed)
#     https://argocd.208.haist.farm/api/dex/callback    (Dex -- used by spec.sso.dex.config)
#   Issuer: https://auth-next.208.haist.farm/application/o/argocd/
#
# NOTE: This ExternalSecret is NOT applied via ArgoCD (bootstrapping: ArgoCD cannot manage
# its own namespace resources without a reconciliation loop). Apply manually:
#   oc apply -f apps/argocd/external-secret.yaml
#
# Tracking: OPS-605 Phase 3, OPS-650
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-authentik-oidc
  namespace: openshift-gitops
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: argocd-authentik-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: clientSecret
      remoteRef:
        key: authentik/clients/argocd
        property: client_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

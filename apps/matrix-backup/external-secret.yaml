# OPS-481 Phase 3: ExternalSecret for matrix-backup CronJob.
# Combines Matrix Synapse PostgreSQL password + MinIO credentials into a single
# K8s Secret consumed by the CronJob as envFrom.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: matrix-backup-config
  namespace: matrix-backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: matrix-backup-config
    creationPolicy: Owner
  data:
    # PostgreSQL password — same source as Matrix Synapse's own deployment
    - secretKey: PGPASSWORD
      remoteRef:
        key: matrix/postgresql
        property: db_password
    # MinIO credentials (scoped to matrix-backups bucket only)
    - secretKey: MINIO_ENDPOINT
      remoteRef:
        key: minio/matrix-backup
        property: endpoint
    - secretKey: MINIO_ACCESS_KEY
      remoteRef:
        key: minio/matrix-backup
        property: access_key
    - secretKey: MINIO_SECRET_KEY
      remoteRef:
        key: minio/matrix-backup
        property: secret_key
    - secretKey: MINIO_BUCKET
      remoteRef:
        key: minio/matrix-backup
        property: bucket

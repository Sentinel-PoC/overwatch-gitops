# OPS-481 Phase 3: ServiceAccount for matrix-backup CronJob.
# No cross-namespace exec needed — pg_dump connects directly to the
# matrix-postgresql Service (TCP 5432). Only SCC binding required.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: matrix-backup-sa
  namespace: matrix-backup
  labels:
    app: matrix-backup
---
# SCC: anyuid — Alpine-based postgres + mc images may run as UID 0 on OKD.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: matrix-backup-anyuid
  labels:
    app: matrix-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: matrix-backup-sa
    namespace: matrix-backup

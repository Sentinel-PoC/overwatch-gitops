---
# Per OPS-203: remoteRef conversionStrategy/decodingStrategy/metadataPolicy
# and target.deletionPolicy are declared explicitly so git state matches
# the CRD-defaulted live state without needing ignoreDifferences magic.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: haists-website-dev-credentials
  namespace: haists-website-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: haists-website-dev-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: HW_OIDC_CLIENT_SECRET
      remoteRef:
        key: keycloak/haists-website
        property: client_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: HW_CONTACT_RECIPIENT_EMAIL
      remoteRef:
        key: haists-website
        property: contact_recipient_email
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: HW_MAILJET_API_KEY
      remoteRef:
        key: mailjet
        property: api_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: HW_MAILJET_SECRET_KEY
      remoteRef:
        key: mailjet
        property: secret_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

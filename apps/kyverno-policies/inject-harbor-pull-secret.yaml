apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: inject-harbor-pull-secret
  annotations:
    policies.kyverno.io/title: Inject Harbor Pull Secret
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Injects harbor-pull-secret as an imagePullSecret into pods
      in namespaces that pull from the private Harbor registry.
      Required after making the Harbor sentinel project private (SEC-19).
spec:
  # ENFORCE: mutate-only policy — adds harbor-pull-secret imagePullSecrets to pods
  # in registry-consuming namespaces. No validate block; Enforce is the correct
  # setting for mutate policies (admission is denied only if the mutation itself
  # errors, which is essentially never for a strategic-merge patch of imagePullSecrets).
  # Changed from implicit Audit default: OPS-112 kyverno enforce restoration.
  validationFailureAction: Enforce
  rules:
    - name: add-harbor-pull-secret
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - backstage
                - defectdojo
                - falco-system
                - monitoring
                - haists-website
                - homepage
                - keycloak
                - matrix
                - media
                - netbox
                - overwatch-console
                - pangolin-internal
                - plane
                - reloader
                - sentinel-ops
                - harbor
                # OPS-481: backup namespaces pull postgres/mc images from Harbor.
                # Bundled add: harbor-pull-secret must inject here or CronJob pods
                # fail ImagePullBackOff (first-deploy risk surfaced by judge-4 on PR #234).
                # langfuse source namespace bundled here: Langfuse pulls from harbor.208.haist.farm
                # registry (sentinel/langfuse + sentinel/langfuse-worker images) but was missing
                # from this list — surfaced as adjacent finding during OPS-481 Phase 4 audit.
                - harbor-backup
                - langfuse
                - langfuse-backup
                - matrix-backup
                - plane-backup
                # OPS-1088: logging+scanopy were not in SEC-82 distribution (previously public images).
                # OPS-1073 (alloy/victoria-logs) and OPS-1085 (scanopy) repointed to private harbor —
                # these namespaces must have the secret injected or pods get ImagePullBackOff.
                - logging
                - scanopy
                # OPS-1106: observability pulls harbor.208.haist.farm/sentinel/tempo (StatefulSet
                # has tempo.pullSecrets in values.yaml, but Kyverno injection provides defence-in-depth
                # for any other pods in the namespace that pull from Harbor).
                - observability
      mutate:
        patchStrategicMerge:
          spec:
            imagePullSecrets:
              - name: harbor-pull-secret

---
# OPS-605 Phase 4: Grafana Authentik OIDC credentials
# Raw ExternalSecret (not Helm extraObjects) to bypass ArgoCD ignoreDifferences on
# .spec.data[]?.remoteRef and .spec.target (OPS-647). Changes here ARE applied by ArgoCD.
#
# Provides env vars consumed by grafana.ini auth.generic_oauth:
#   GF_AUTH_GENERIC_OAUTH_CLIENT_ID     -> Authentik grafana application client_id
#   GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET -> Authentik grafana application client_secret
#
# Vault path: secret/authentik/clients/grafana
# Listed first in envFromSecrets so its values win on key conflict with legacy secrets.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-oidc-secret
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: argocd
    security.sentinel/issue: OPS-605
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: grafana-oidc-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
      remoteRef:
        key: authentik/clients/grafana
        property: client_id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
      remoteRef:
        key: authentik/clients/grafana
        property: client_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

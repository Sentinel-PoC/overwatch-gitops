# OPS-481 Phase 4: ExternalSecret for langfuse-backup CronJob.
# Combines Langfuse PostgreSQL password + MinIO credentials into a single
# K8s Secret consumed by the CronJob as envFrom.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: langfuse-backup-config
  namespace: langfuse-backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: langfuse-backup-config
    creationPolicy: Owner
  data:
    # PostgreSQL password — same source as Langfuse's own deployment (OPS-110)
    - secretKey: PGPASSWORD
      remoteRef:
        key: langfuse/postgresql
        property: password
    # MinIO credentials (scoped to langfuse-backups bucket only)
    - secretKey: MINIO_ENDPOINT
      remoteRef:
        key: minio/langfuse-backup
        property: endpoint
    - secretKey: MINIO_ACCESS_KEY
      remoteRef:
        key: minio/langfuse-backup
        property: access_key
    - secretKey: MINIO_SECRET_KEY
      remoteRef:
        key: minio/langfuse-backup
        property: secret_key
    - secretKey: MINIO_BUCKET
      remoteRef:
        key: minio/langfuse-backup
        property: bucket

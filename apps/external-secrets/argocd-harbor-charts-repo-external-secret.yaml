apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
# OPS-1186: ArgoCD OCI Helm repository credential for Harbor (harbor.208.haist.farm).
# Lets the repo-server pull mirrored Helm charts from Harbor over the cluster-internal
# ingress VIP (192.168.12.168), which the SEC-85 egress NetworkPolicy already permits —
# so external Helm egress stays blocked (OPS-1185). Charts live in the `sentinel` project.
metadata:
  name: argocd-harbor-charts-repo
  namespace: openshift-gitops
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: argocd-harbor-charts-repo
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: "helm"
        url: "harbor.208.haist.farm/sentinel"
        enableOCI: "true"
        name: "harbor-charts"
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    # robot$pull-sentinel — pull-only, scoped to the sentinel Harbor project.
    - secretKey: username
      remoteRef:
        key: harbor/robot-pull
        property: username
    - secretKey: password
      remoteRef:
        key: harbor/robot-pull
        property: password

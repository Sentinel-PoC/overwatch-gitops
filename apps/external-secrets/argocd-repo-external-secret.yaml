apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-forgejo-repo
  namespace: openshift-gitops
spec:
  refreshInterval: 30m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: argocd-forgejo-repo
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: "git"
        url: "https://forgejo.208.haist.farm/sentinel-admin/overwatch-gitops.git"
        username: "renovate-bot"
        password: "{{ .token }}"
        # SEC-83: insecure:true removed; Forgejo FQDN cert is Let's Encrypt R13 (publicly trusted).
  data:
    # SEC-83: switched from write-scoped sentinel-worker token to read-only forgejo-gitops-ro.
    # renovate-bot account, read:repository scope only, collaborator perm = read on overwatch-gitops.
    - secretKey: token
      remoteRef:
        key: forgejo-gitops-ro
        property: api_token

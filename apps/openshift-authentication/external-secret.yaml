---
# ExternalSecret: materialize authentik-okd-secret in openshift-config namespace.
#
# The OKD OAuth/cluster resource references Secret.clientSecret.name in the
# openshift-config namespace (same namespace as the existing keycloak-okd-secret).
# This ExternalSecret pulls the Authentik OIDC client_secret from Vault and
# materialises it as a Kubernetes Secret named authentik-okd-secret.
#
# Vault path: secret/authentik/clients/oauth-openshift
# Tracking: OPS-605 Phase 3
# Activation blocker: OPS-629 (Pangolin OIDC discovery 404 must be resolved first)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: authentik-okd-secret
  namespace: openshift-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: authentik-okd-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: clientSecret
      remoteRef:
        key: authentik/clients/oauth-openshift
        property: client_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

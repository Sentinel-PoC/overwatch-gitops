---
# OPS-605 Phase 4: Allow DefectDojo egress to Authentik (auth-next.208.haist.farm)
# Required for OIDC discovery and token exchange in DD_SOCIAL_AUTH_OIDC_OAUTH2_ENABLED mode.
# DefectDojo runs in the Istio mesh (sidecar.istio.io/inject: "true") in REGISTRY_ONLY
# outbound mode. Without this ServiceEntry, startup OIDC discovery fails silently and
# the "Login with Authentik" button does not appear.
#
# auth-next.208.haist.farm resolves to 192.168.12.168 (Pangolin VIP) which proxies
# to the Authentik container at 192.168.12.83:9000.
#
# Authentik provider redirect_uri for DefectDojo OIDC backend:
#   https://defectdojo.208.haist.farm/complete/oidc/ (strict, set via API 2026-05-15)
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: defectdojo-authentik-egress
  namespace: defectdojo
  labels:
    app.kubernetes.io/managed-by: argocd
    security.sentinel/egress: authentik-oidc
    security.sentinel/issue: OPS-605
spec:
  hosts:
    - auth-next.208.haist.farm
  addresses:
    - 192.168.12.168
  ports:
    - number: 443
      name: https
      protocol: HTTPS
  resolution: STATIC
  location: MESH_EXTERNAL
  endpoints:
    - address: 192.168.12.168

---
# OPS-398: Scanopy secrets pulled from Vault.
# Operator must create the Vault path before ArgoCD syncs:
#   vault kv put secret/scanopy \
#     db_password=<random> \
#     admin_password=<random>
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: scanopy-postgresql
  namespace: scanopy
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: scanopy-postgresql
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: scanopy
        property: db_password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: scanopy-server
  namespace: scanopy
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: scanopy-server
    creationPolicy: Owner
  data:
    - secretKey: db_password
      remoteRef:
        key: scanopy
        property: db_password

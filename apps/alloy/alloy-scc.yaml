apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: alloy-logging
  annotations:
    kubernetes.io/description: "SCC for Grafana Alloy log shipper. No hostPath needed — uses k8s API."
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/component: log-shipper
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: false
allowPrivilegedContainer: false
allowedCapabilities: []
defaultAddCapabilities: []
requiredDropCapabilities:
  - ALL
seccompProfiles:
  - runtime/default
fsGroup:
  type: RunAsAny
runAsUser:
  type: MustRunAsNonRoot
seLinuxContext:
  type: MustRunAs
  seLinuxOptions:
    type: container_t
supplementalGroups:
  type: RunAsAny
volumes:
  - configMap
  - emptyDir
  - projected
  - secret
users:
  - system:serviceaccount:logging:alloy

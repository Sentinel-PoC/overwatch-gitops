# OPS-481 Phase 2: ExternalSecret for harbor-backup CronJob.
# Combines PostgreSQL password + MinIO credentials into a single K8s Secret
# consumed by the CronJob as envFrom.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: harbor-backup-config
  namespace: harbor-backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-backup-config
    creationPolicy: Owner
  data:
    # PostgreSQL password — same source as Harbor's own deployment (secret/harbor.db_password)
    - secretKey: PGPASSWORD
      remoteRef:
        key: harbor
        property: db_password
    # MinIO credentials (scoped to harbor-backups bucket only)
    - secretKey: MINIO_ENDPOINT
      remoteRef:
        key: minio/harbor-backup
        property: endpoint
    - secretKey: MINIO_ACCESS_KEY
      remoteRef:
        key: minio/harbor-backup
        property: access_key
    - secretKey: MINIO_SECRET_KEY
      remoteRef:
        key: minio/harbor-backup
        property: secret_key
    - secretKey: MINIO_BUCKET
      remoteRef:
        key: minio/harbor-backup
        property: bucket

# OPS-481 Phase 2: Harbor PostgreSQL backup CronJob.
#
# Design:
#   Init container: postgres:16.13-alpine3.23 — pg_dump directly to harbor-database
#     Service (TCP 5432, no kubectl exec needed).
#     DB: registry (Harbor's internal PostgreSQL DB name).
#     Output: /backup/harbor-<TIMESTAMP>.dump (custom format = zlib-compressed binary).
#     NOTE: pg_dump --format=custom already uses zlib compression internally; no
#     additional gzip pipe is applied (double-compression wastes CPU, grows files).
#   Main container: mc:latest — uploads dump to MinIO harbor-backups bucket (.58).
#     Both containers share an emptyDir volume for the dump file.
#
# Credentials: envFrom harbor-backup-config (ExternalSecret) provides:
#   PGPASSWORD, MINIO_ENDPOINT, MINIO_ACCESS_KEY, MINIO_SECRET_KEY, MINIO_BUCKET
#
# Cadence: daily (02:00 UTC) — Harbor registry metadata is much smaller than Plane;
# daily backups are sufficient for registry metadata recovery. Hourly would be wasteful.
#
# COMP-3 controls: CP-9 (system backup), CP-9(1) (separation of primary + backup storage).
# Primary: TrueNAS .205 (PostgreSQL PVC). Backup: MinIO .58 (different hardware).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: harbor-backup
  namespace: harbor-backup
  labels:
    app: harbor-backup
  annotations:
    compliance.sentinel/controls: "CP-9,CP-9(1)"
    compliance.sentinel/description: >
      Daily pg_dump of Harbor PostgreSQL to MinIO .58 (OPS-481 Phase 2).
      Separate hardware from TrueNAS primary storage (CP-9(1) separation).
spec:
  schedule: "0 2 * * *"        # daily at 02:00 UTC
  concurrencyPolicy: Forbid     # never overlap backup runs
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600  # 1h max; Harbor dump should complete in <5 min
      template:
        metadata:
          labels:
            app: harbor-backup
        spec:
          serviceAccountName: harbor-backup-sa
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: false  # Alpine images; anyuid SCC bound above
          imagePullSecrets:
            - name: harbor-pull-secret
          initContainers:
            - name: pg-dump
              image: harbor.208.haist.farm/sentinel/postgres@sha256:a513e5eb5d31612c5c29565e403ba72861b0da184a8676eb5f2bbc0caae3d8ff
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
                  DUMPFILE="/backup/harbor-${TIMESTAMP}.dump"
                  echo "[pg-dump] Starting pg_dump to ${DUMPFILE}"
                  pg_dump \
                    --host=harbor-database.harbor.svc.cluster.local \
                    --port=5432 \
                    --username=harbor \
                    --dbname=registry \
                    --format=custom \
                    --file="${DUMPFILE}"
                  echo "[pg-dump] Dump complete: $(du -sh ${DUMPFILE})"
                  # Write filename to shared vol so upload container can find it
                  echo "${DUMPFILE}" > /backup/latest.txt
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: harbor-backup-config
                      key: PGPASSWORD
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
              volumeMounts:
                - name: backup-vol
                  mountPath: /backup
          containers:
            - name: upload
              image: harbor.208.haist.farm/sentinel/mc@sha256:dce495b4f330bf87354c62743e06c3c7d68eedd23f8f94853a441931469cebdb
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  DUMPFILE=$(cat /backup/latest.txt)
                  echo "[upload] Uploading ${DUMPFILE} to MinIO"
                  mc alias set target "${MINIO_ENDPOINT}" "${MINIO_ACCESS_KEY}" "${MINIO_SECRET_KEY}"
                  mc cp "${DUMPFILE}" "target/${MINIO_BUCKET}/$(basename ${DUMPFILE})"
                  echo "[upload] Done: s3://${MINIO_BUCKET}/$(basename ${DUMPFILE})"
                  # Verify upload succeeded
                  mc ls "target/${MINIO_BUCKET}/$(basename ${DUMPFILE})"
              envFrom:
                - secretRef:
                    name: harbor-backup-config
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "256Mi"
              volumeMounts:
                - name: backup-vol
                  mountPath: /backup
          volumes:
            - name: backup-vol
              emptyDir:
                sizeLimit: 1Gi  # Harbor registry DB is metadata-only; expected <200 MiB

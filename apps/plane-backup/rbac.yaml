# OPS-481: ServiceAccount for plane-backup CronJob.
# No cross-namespace exec needed — pg_dump connects directly to the
# plane-postgresql Service (TCP 5432). Only SCC binding required.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: plane-backup-sa
  namespace: plane-backup
  labels:
    app: plane-backup
---
# SCC: anyuid — Alpine-based postgres + mc images may run as UID 0 on OKD.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: plane-backup-anyuid
  labels:
    app: plane-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: plane-backup-sa
    namespace: plane-backup

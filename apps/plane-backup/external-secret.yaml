# OPS-481: ExternalSecret for plane-backup CronJob.
# Combines PostgreSQL password + MinIO credentials into a single K8s Secret
# consumed by the CronJob as envFrom.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: plane-backup-config
  namespace: plane-backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: plane-backup-config
    creationPolicy: Owner
  data:
    # PostgreSQL password — same source as Plane's own deployment
    - secretKey: PGPASSWORD
      remoteRef:
        key: plane
        property: db_password
    # MinIO credentials (scoped to plane-backups bucket only)
    - secretKey: MINIO_ENDPOINT
      remoteRef:
        key: minio/plane-backup
        property: endpoint
    - secretKey: MINIO_ACCESS_KEY
      remoteRef:
        key: minio/plane-backup
        property: access_key
    - secretKey: MINIO_SECRET_KEY
      remoteRef:
        key: minio/plane-backup
        property: secret_key
    - secretKey: MINIO_BUCKET
      remoteRef:
        key: minio/plane-backup
        property: bucket

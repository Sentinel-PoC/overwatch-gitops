---
# SEC-48: ClickHouse default-user password loaded from Vault rather than
# hardcoded in deployment.yaml / langfuse-ch-backup-cronjob.yaml.
#
# Vault path: secret/langfuse/clickhouse, key 'password'.
#
# This migration alone does NOT rotate the credential — at the time of
# the PR, Vault holds the same placeholder value the manifests held
# before, so the live ClickHouse server / langfuse pods continue to
# authenticate identically. To actually rotate (the operator-gated step):
#   1. clickhouse-client -q "ALTER USER default IDENTIFIED BY '<new>'"
#   2. vault kv put secret/langfuse/clickhouse password='<new>'
#   3. oc -n langfuse rollout restart deployment/langfuse-clickhouse
#      deployment/langfuse-web deployment/langfuse-worker
#   4. trigger the backup CronJob once and confirm it succeeds
# Helm chart side (values.yaml clickhouse.auth.password) is a separate
# rewrite tracked under SEC-46 — that one needs the langfuse Helm chart
# to support `clickhouse.auth.existingSecret` or equivalent, which the
# 1.5.x chart line may or may not.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: langfuse-clickhouse-creds
  namespace: langfuse
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/instance: langfuse
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: langfuse-clickhouse-creds
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: CLICKHOUSE_PASSWORD
      remoteRef:
        key: langfuse/clickhouse
        property: password

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: langfuse-minio-creds
  namespace: langfuse
  labels:
    app.kubernetes.io/name: clickhouse-backup
    app.kubernetes.io/instance: langfuse
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: langfuse-minio-creds
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: MINIO_ENDPOINT
    remoteRef:
      key: minio
      property: endpoint
  - secretKey: MINIO_ACCESS_KEY
    remoteRef:
      key: minio
      property: access_key
  - secretKey: MINIO_SECRET_KEY
    remoteRef:
      key: minio
      property: secret_key

---
# ExternalSecret pulling credentials needed by the evaluator setup Job.
#
# - GEMINI_API_KEY: the LLM that will do the judging. Stored in Vault at
#   secret/gemini (field: api_key) since 2026-03-18.
# - LANGFUSE_PROJECT_PUBLIC_KEY / SECRET_KEY: project-level keys for the
#   overwatch-agents project. The Langfuse llm-connections API is
#   per-project and uses project-scoped basic auth
#   (base64(public_key:secret_key)). No org-level admin key is needed.
#   Source of truth: secret/langfuse/overwatch-agents in Vault.
#   Operator creates this secret during bootstrap (runbook 08 step 2).
#
# refreshInterval: 1h — Gemini key rotation or project key rotation
# takes at most an hour to propagate into the Job's pod env.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: langfuse-evaluators-credentials
  namespace: langfuse
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: langfuse-evaluators-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: gemini
        property: api_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: LANGFUSE_PROJECT_PUBLIC_KEY
      remoteRef:
        key: langfuse/overwatch-agents
        property: public_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: LANGFUSE_PROJECT_SECRET_KEY
      remoteRef:
        key: langfuse/overwatch-agents
        property: secret_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

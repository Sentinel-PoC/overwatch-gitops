---
# OPS-110: PostgreSQL password loaded from Vault.
# Vault path: secret/langfuse/postgresql, key 'password'.
#
# ROTATION PROCEDURE (SAFE-ROTATE):
#   1. Update Vault: vault kv patch secret/langfuse/postgresql password='<new>'
#   2. Trigger ESO refresh:
#      kubectl annotate externalsecret langfuse-pg-creds \
#        reconcile.external-secrets.io/trigger=$(date +%s) --overwrite -n langfuse
#   3. ALTER USER langfuse PASSWORD '<new>' on the live postgres pod:
#      kubectl exec -n langfuse deploy/langfuse-postgresql -- \
#        psql -U langfuse -d postgres_langfuse -c "ALTER USER langfuse PASSWORD '<new>'"
#   4. kubectl rollout restart deploy/langfuse-postgresql -n langfuse
#   5. kubectl rollout restart deploy/langfuse-web deploy/langfuse-worker -n langfuse
#   6. Confirm langfuse-web and langfuse-worker reach Running state.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: langfuse-pg-creds
  namespace: langfuse
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: langfuse
    app.kubernetes.io/component: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: langfuse-pg-creds
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: langfuse/postgresql
        property: password

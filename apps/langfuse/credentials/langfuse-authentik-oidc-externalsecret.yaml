---
# OPS-633: Langfuse Authentik OIDC credentials
# Vault path: secret/authentik/clients/langfuse
#
# Provides env vars consumed by Langfuse NextAuth.js Authentik provider:
#   AUTH_AUTHENTIK_CLIENT_ID     -> Authentik langfuse application client_id
#   AUTH_AUTHENTIK_CLIENT_SECRET -> Authentik langfuse application client_secret
#
# AUTH_AUTHENTIK_ISSUER is a static public URL configured directly in values.yaml
# additionalEnv (no secret needed).
#
# Dual-running: local credentials auth remains enabled (AUTH_DISABLE_USERNAME_PASSWORD
# is NOT set). Admin account (jim@haist.farm) still works during SSO validation.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: langfuse-authentik-oidc
  namespace: langfuse
  labels:
    app.kubernetes.io/name: langfuse
    app.kubernetes.io/instance: langfuse
    app.kubernetes.io/component: authentik-oidc
    app.kubernetes.io/managed-by: argocd
    security.sentinel/issue: OPS-633
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: langfuse-authentik-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: AUTH_AUTHENTIK_CLIENT_ID
      remoteRef:
        key: authentik/clients/langfuse
        property: client_id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: AUTH_AUTHENTIK_CLIENT_SECRET
      remoteRef:
        key: authentik/clients/langfuse
        property: client_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

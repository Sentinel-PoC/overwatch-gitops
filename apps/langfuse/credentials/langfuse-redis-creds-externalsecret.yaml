---
# OPS-110: Redis (Valkey) password loaded from Vault.
# Vault path: secret/langfuse/redis, key 'password'.
#
# ROTATION PROCEDURE (SAFE-ROTATE):
#   1. Update Vault: vault kv patch secret/langfuse/redis password='<new>'
#   2. Trigger ESO refresh:
#      kubectl annotate externalsecret langfuse-redis-creds \
#        reconcile.external-secrets.io/trigger=$(date +%s) --overwrite -n langfuse
#   3. kubectl rollout restart deploy/langfuse-redis -n langfuse
#      (Valkey/Redis picks up new --requirepass from env on restart)
#   4. kubectl rollout restart deploy/langfuse-web deploy/langfuse-worker -n langfuse
#      (langfuse reconnects with new REDIS_PASSWORD)
#   NOTE: BullMQ queues are ephemeral; any in-flight jobs during restart window
#         will be re-queued on reconnect. No data loss.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: langfuse-redis-creds
  namespace: langfuse
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: langfuse
    app.kubernetes.io/component: cache
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: langfuse-redis-creds
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: langfuse/redis
        property: password

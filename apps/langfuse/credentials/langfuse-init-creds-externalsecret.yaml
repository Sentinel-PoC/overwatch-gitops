---
# OPS-110: Headless initialization credentials loaded from Vault.
# Vault path: secret/langfuse/init
#   - user_password:       Initial admin user password (Jim's Langfuse UI login)
#   - project_public_key:  LANGFUSE_INIT_PROJECT_PUBLIC_KEY (pk-lf-UUID format)
#   - project_secret_key:  LANGFUSE_INIT_PROJECT_SECRET_KEY (sk-lf-UUID format)
#
# IMPORTANT — SALT ROTATION INTERACTION:
#   These INIT_* env vars only seed the DB if the resource does not already exist.
#   After SALT rotation, the project API key hashes in postgres become invalid.
#   The rotation procedure for SALT is:
#     1. Rotate SALT (new value in Vault → ESO sync → pod restart)
#     2. Connect to postgres pod and delete the stale API key row:
#        kubectl exec -n langfuse deploy/langfuse-postgresql -- \
#          psql -U langfuse -d postgres_langfuse -c \
#          "DELETE FROM api_keys WHERE public_key = '<old-pk>';"
#     3. Restart langfuse-web + langfuse-worker — headless-init creates fresh
#        API keys using the INIT values from this secret (re-hashed under new SALT)
#     4. Update Vault secret/langfuse/overwatch-agents with the new key values
#        (must match what langfuse-init-creds holds for project_public_key + project_secret_key)
#     5. ESO will sync langfuse-evaluators-credentials on next refresh (1h) or force-annotate
#
# NOTE: INIT_USER_PASSWORD is bootstrap-only. To change Jim's actual login password,
#       use the Langfuse UI (Settings → Profile) after rotation.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: langfuse-init-creds
  namespace: langfuse
  labels:
    app.kubernetes.io/name: langfuse
    app.kubernetes.io/instance: langfuse
    app.kubernetes.io/component: init-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: langfuse-init-creds
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: user_password
      remoteRef:
        key: langfuse/init
        property: user_password
    - secretKey: project_public_key
      remoteRef:
        key: langfuse/init
        property: project_public_key
    - secretKey: project_secret_key
      remoteRef:
        key: langfuse/init
        property: project_secret_key

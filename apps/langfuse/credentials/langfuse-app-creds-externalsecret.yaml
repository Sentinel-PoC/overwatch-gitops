---
# OPS-110: Application-level encryption/auth credentials loaded from Vault.
# Vault path: secret/langfuse/app
#   - nextauth_secret: 64-char hex; signs NextAuth.js JWTs / session cookies
#   - salt:            64-char hex; salts hashed project API keys
#   - encryption_key:  64-char hex; AES-encrypts stored LLM API keys + integrations
#
# ROTATION IMPACT per credential (documented 2026-05-09 OPS-110 PLAN comment 9387e927):
#   nextauth_secret  — SAFE-ROTATE: active sessions invalidated, re-login required
#   salt             — MIGRATION-NEEDED: all API key hashes invalidated; must delete
#                      api_keys rows from postgres + restart langfuse so headless-init
#                      recreates keys under new SALT; update Vault secret/langfuse/overwatch-agents
#   encryption_key   — MIGRATION-NEEDED: stored LLM/integration credentials
#                      (Gemini API key) become undecryptable; re-run evaluators/setup-job.yaml
#
# NOTE: Prior config had nextauth_secret == encryption_key (same value). Both are now
# independent random values. Source: langfuse-docs content/self-hosting/configuration/encryption.mdx
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: langfuse-app-creds
  namespace: langfuse
  labels:
    app.kubernetes.io/name: langfuse
    app.kubernetes.io/instance: langfuse
    app.kubernetes.io/component: app-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: langfuse-app-creds
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: NEXTAUTH_SECRET
      remoteRef:
        key: langfuse/app
        property: nextauth_secret
    - secretKey: SALT
      remoteRef:
        key: langfuse/app
        property: salt
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: langfuse/app
        property: encryption_key

---
# OPS-110: MinIO (S3-compatible) root credentials loaded from Vault.
# Vault path: secret/langfuse/s3
#   - root_password: MinIO MINIO_ROOT_PASSWORD / S3 secretAccessKey
#   - root_user:     MinIO MINIO_ROOT_USER / S3 accessKeyId (langfuse-admin, not secret)
#
# ROTATION PROCEDURE (SAFE-ROTATE):
#   1. Update Vault: vault kv patch secret/langfuse/s3 root_password='<new>'
#   2. Trigger ESO refresh:
#      kubectl annotate externalsecret langfuse-s3-creds \
#        reconcile.external-secrets.io/trigger=$(date +%s) --overwrite -n langfuse
#   3. kubectl rollout restart deploy/langfuse-s3 -n langfuse
#      (MinIO picks up new MINIO_ROOT_PASSWORD on restart; existing bucket data preserved)
#   4. kubectl rollout restart deploy/langfuse-web deploy/langfuse-worker -n langfuse
#      (langfuse reconnects with new S3 secret access key)
#   NOTE: langfuse-s3 uses emptyDir — data is ephemeral. Events/media stored here
#         are transient cache; rotate freely without data concern.
#
# DISTINCT from secret/minio (TrueNAS MinIO at .205) used by the backup cronjob.
# This secret covers only the langfuse-s3 pod's own root credentials.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: langfuse-s3-creds
  namespace: langfuse
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/instance: langfuse
    app.kubernetes.io/component: object-storage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: langfuse-s3-creds
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: root_user
      remoteRef:
        key: langfuse/s3
        property: root_user
    - secretKey: root_password
      remoteRef:
        key: langfuse/s3
        property: root_password

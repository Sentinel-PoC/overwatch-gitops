---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: harbor-credentials
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: harbor-credentials
    creationPolicy: Owner
  data:
    - secretKey: HARBOR_ADMIN_PASSWORD
      remoteRef:
        key: harbor
        property: admin_password
    - secretKey: secretKey
      remoteRef:
        key: harbor
        property: secret_key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: harbor-database
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: harbor-database
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: harbor
        property: db_password
---
# OPS-605 Phase 4: Harbor OIDC cutover — Authentik ACTIVE (2026-05-15)
# Authentik is the ACTIVE OIDC provider (switched from Keycloak via admin API).
# Harbor API was called with PUT /api/v2.0/configurations on 2026-05-15.
#
# Active config applied:
#   oidc_name:         Authentik
#   oidc_endpoint:     https://auth-next.208.haist.farm/application/o/harbor/
#   oidc_client_id:    (from secret/authentik/clients/harbor.client_id)
#   oidc_scope:        openid,profile,email,groups
#   oidc_groups_claim: groups
#   oidc_auto_onboard: true
#   oidc_user_claim:   preferred_username
#
# NOTE: oidc_endpoint MUST include trailing slash — Authentik issuer URL
# has trailing slash; Harbor validates issuer == endpoint during discovery.
# Removing trailing slash → HTTP 500 on /c/oidc/login.
#
# OIDC metadata: https://auth-next.208.haist.farm/application/o/harbor/.well-known/openid-configuration
# Authentik app slug: harbor  |  Vault path: secret/authentik/clients/harbor
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: harbor-oidc
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: harbor-oidc
    creationPolicy: Owner
  data:
    # === ACTIVE PROVIDER: Authentik (OPS-605 phase 4, 2026-05-15) ===
    - secretKey: client_secret
      remoteRef:
        key: keycloak/harbor
        property: client_secret
    # === RETIRED PROVIDER: Keycloak (client_secret retained for rollback) ===
    - secretKey: OIDC_AUTHENTIK_CLIENT_ID
      remoteRef:
        key: authentik/clients/harbor
        property: client_id
    - secretKey: OIDC_AUTHENTIK_CLIENT_SECRET
      remoteRef:
        key: authentik/clients/harbor
        property: client_secret

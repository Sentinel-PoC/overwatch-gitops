apiVersion: v1
kind: PersistentVolume
metadata:
  name: harbor-pg-iscsi
  labels:
    app: harbor-postgresql
spec:
  capacity:
    storage: 15Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: harbor-postgresql-data
    namespace: harbor
  iscsi:
    targetPortal: "192.168.30.205:3260"
    iqn: "iqn.2026-03.farm.haist:okd-harbor-pg"
    lun: 0
    fsType: "xfs"
    readOnly: false

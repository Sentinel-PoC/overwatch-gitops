apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backstage-credentials
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: backstage-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: BACKEND_SECRET
    remoteRef:
      key: backstage
      property: backend_secret
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: POSTGRES_PASSWORD
    remoteRef:
      key: backstage
      property: postgres_password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: POSTGRES_USER
    remoteRef:
      key: backstage
      property: postgres_user
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: POSTGRES_HOST
    remoteRef:
      key: backstage
      property: postgres_host
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: POSTGRES_PORT
    remoteRef:
      key: backstage
      property: postgres_port
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: OIDC_CLIENT_ID
    remoteRef:
      key: authentik/clients/backstage
      property: client_id
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: OIDC_CLIENT_SECRET
    remoteRef:
      key: authentik/clients/backstage
      property: client_secret
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: MCP_TOKEN
    remoteRef:
      key: mcp
      property: backstage_mcp_token
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: SESSION_SECRET
    remoteRef:
      key: backstage
      property: session_secret
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: ARGOCD_AUTH_TOKEN
    remoteRef:
      key: backstage
      property: argocd_token
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: GRAFANA_TOKEN
    remoteRef:
      key: backstage
      property: grafana_token
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: VAULT_TOKEN
    remoteRef:
      key: backstage
      property: vault_token
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: TECHDOCS_S3_ACCESS_KEY
    remoteRef:
      key: backstage-techdocs
      property: access_key
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: TECHDOCS_S3_SECRET_KEY
    remoteRef:
      key: backstage-techdocs
      property: secret_key
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: AUTHENTIK_CLIENT_ID
    remoteRef:
      key: authentik/clients/backstage
      property: client_id
  - secretKey: AUTHENTIK_CLIENT_SECRET
    remoteRef:
      key: authentik/clients/backstage
      property: client_secret
  # OPS-660: restore Forgejo token for catalog integration
  # FORGEJO_TOKEN was removed in OPS-648 drift backfill; without it the Gitea
  # integration has no credentials and all catalog reads fail with AuthenticationError.
  # Root effect: emailMatchingUserEntityProfileEmail sign-in resolver sees no User
  # entities → every OIDC login fails → browser ends up at /api/auth/oidc/handler (404).
  # SEC-83: switched from write-scoped sentinel-worker token to read-only forgejo-gitops-ro.
  # renovate-bot account, read:repository scope, collaborator perm = read on overwatch-gitops.
  - secretKey: FORGEJO_TOKEN
    remoteRef:
      key: forgejo-gitops-ro
      property: api_token
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backstage-postgresql
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: backstage-postgresql
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: password
    remoteRef:
      key: backstage
      property: postgres_password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: postgres-password
    remoteRef:
      key: backstage
      property: postgres_password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None

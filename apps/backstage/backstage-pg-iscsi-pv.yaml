apiVersion: v1
kind: PersistentVolume
metadata:
  name: backstage-pg-iscsi
  labels:
    app: backstage-postgresql
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: backstage-postgresql-data
    namespace: backstage
  iscsi:
    targetPortal: "192.168.30.205:3260"
    iqn: "iqn.2026-03.farm.haist:okd-backstage-pg"
    lun: 0
    fsType: "xfs"
    readOnly: false

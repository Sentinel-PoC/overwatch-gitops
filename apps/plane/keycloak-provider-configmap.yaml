apiVersion: v1
kind: ConfigMap
metadata:
  name: plane-keycloak-provider
  namespace: plane
data:
  gitea.py: |
    """OIDC provider using the Gitea adapter slot.

    This patches the Gitea OAuth provider to use standard OIDC discovery
    (RFC 8414 / OpenID Connect Discovery 1.0) instead of hardcoded Keycloak
    endpoint paths. Works with any standards-compliant OIDC IdP (Authentik,
    Keycloak, etc.).

    Configuration (via instance_configurations or env vars):
      GITEA_CLIENT_ID     -> OIDC client ID
      GITEA_CLIENT_SECRET -> OIDC client secret
      GITEA_HOST          -> OIDC issuer / app URL
                             (e.g., "https://auth-next.208.haist.farm/application/o/plane/")
      IS_GITEA_ENABLED    -> "1" to enable

    The provider performs OIDC discovery at startup by fetching
    {GITEA_HOST}/.well-known/openid-configuration and reading
    token_endpoint, userinfo_endpoint, and authorization_endpoint.

    OPS-605 phase 4 (2026-05-15): updated from Keycloak hardcoded paths to
    OIDC discovery so the same code works with Authentik or any OIDC IdP.
    """

    import os
    from datetime import datetime, timedelta
    from urllib.parse import urlencode, urlparse

    import pytz
    import requests

    from plane.authentication.adapter.oauth import OauthAdapter
    from plane.license.utils.instance_value import get_configuration_value
    from plane.authentication.adapter.error import (
        AUTHENTICATION_ERROR_CODES,
        AuthenticationException,
    )


    class GiteaOAuthProvider(OauthAdapter):
        provider = "gitea"
        scope = "openid email profile"

        def __init__(self, request, code=None, state=None, callback=None):
            (GITEA_CLIENT_ID, GITEA_CLIENT_SECRET, GITEA_HOST) = get_configuration_value(
                [
                    {
                        "key": "GITEA_CLIENT_ID",
                        "default": os.environ.get("GITEA_CLIENT_ID"),
                    },
                    {
                        "key": "GITEA_CLIENT_SECRET",
                        "default": os.environ.get("GITEA_CLIENT_SECRET"),
                    },
                    {
                        "key": "GITEA_HOST",
                        "default": os.environ.get("GITEA_HOST"),
                    },
                ]
            )

            if not (GITEA_CLIENT_ID and GITEA_CLIENT_SECRET and GITEA_HOST):
                raise AuthenticationException(
                    error_code=AUTHENTICATION_ERROR_CODES["GITEA_NOT_CONFIGURED"],
                    error_message="GITEA_NOT_CONFIGURED",
                )

            parsed = urlparse(GITEA_HOST)
            if not parsed.scheme or parsed.scheme not in ("https", "http"):
                raise AuthenticationException(
                    error_code=AUTHENTICATION_ERROR_CODES["GITEA_NOT_CONFIGURED"],
                    error_message="GITEA_NOT_CONFIGURED",
                )
            GITEA_HOST = GITEA_HOST.rstrip("/")

            # OIDC discovery — RFC 8414 / OpenID Connect Discovery 1.0
            # Replaces hardcoded Keycloak paths (/protocol/openid-connect/*)
            # GITEA_HOST for Authentik: https://auth-next.208.haist.farm/application/o/plane/
            oidc_config_url = f"{GITEA_HOST}/.well-known/openid-configuration"
            try:
                oidc_resp = requests.get(oidc_config_url, timeout=10)
                oidc_resp.raise_for_status()
                oidc_config = oidc_resp.json()
            except Exception as exc:
                raise AuthenticationException(
                    error_code=AUTHENTICATION_ERROR_CODES["GITEA_NOT_CONFIGURED"],
                    error_message=f"GITEA_NOT_CONFIGURED: OIDC discovery failed at {oidc_config_url}: {exc}",
                )

            self.token_url = oidc_config["token_endpoint"]
            self.userinfo_url = oidc_config["userinfo_endpoint"]
            auth_endpoint = oidc_config["authorization_endpoint"]

            client_id = GITEA_CLIENT_ID
            client_secret = GITEA_CLIENT_SECRET

            redirect_uri = f"{'https' if request.is_secure() else 'http'}://{request.get_host()}/auth/gitea/callback/"
            url_params = {
                "client_id": client_id,
                "scope": self.scope,
                "redirect_uri": redirect_uri,
                "response_type": "code",
                "state": state,
            }
            auth_url = f"{auth_endpoint}?{urlencode(url_params)}"

            super().__init__(
                request,
                self.provider,
                client_id,
                self.scope,
                redirect_uri,
                auth_url,
                self.token_url,
                self.userinfo_url,
                client_secret,
                code,
                callback=callback,
            )

        def set_token_data(self):
            data = {
                "code": self.code,
                "client_id": self.client_id,
                "client_secret": self.client_secret,
                "redirect_uri": self.redirect_uri,
                "grant_type": "authorization_code",
            }
            headers = {"Accept": "application/json"}
            token_response = self.get_user_token(data=data, headers=headers)
            super().set_token_data(
                {
                    "access_token": token_response.get("access_token"),
                    "refresh_token": token_response.get("refresh_token", None),
                    "access_token_expired_at": (
                        datetime.now(tz=pytz.utc) + timedelta(seconds=token_response.get("expires_in"))
                        if token_response.get("expires_in")
                        else None
                    ),
                    "refresh_token_expired_at": None,
                    "id_token": token_response.get("id_token", ""),
                }
            )

        def set_user_data(self):
            user_info_response = self.get_user_response()
            # Standard OIDC userinfo: sub, email, name, preferred_username, email_verified
            email = user_info_response.get("email")
            if not email:
                raise AuthenticationException(
                    error_code=AUTHENTICATION_ERROR_CODES["GITEA_OAUTH_PROVIDER_ERROR"],
                    error_message="GITEA_OAUTH_PROVIDER_ERROR: No email in OIDC userinfo response",
                )

            super().set_user_data(
                {
                    "email": email,
                    "user": {
                        "provider_id": str(user_info_response.get("sub", "")),
                        "email": email,
                        "avatar": user_info_response.get("picture", ""),
                        "first_name": user_info_response.get("given_name")
                            or user_info_response.get("name")
                            or user_info_response.get("preferred_username", ""),
                        "last_name": user_info_response.get("family_name", ""),
                        "is_password_autoset": True,
                    },
                }
            )

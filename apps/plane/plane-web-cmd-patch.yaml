---
# OPS-455: Durable CMD patch for plane-web-wl
#
# Harbor-mirrored plane-frontend:v0.24.0 has ENTRYPOINT=docker-entrypoint.sh
# and CMD=["node"] (bare, no script arg). The Next.js server requires
# CMD=["node","web/server.js"] to start. Helm chart plane-ce 1.4.1 does not
# template command/args — it relies on image CMD entirely.
#
# Applied via ServerSideApply (separate field manager from Helm). Helm owns
# all other Deployment fields; this manifest owns only command + args.
# plane-live is unaffected: uses plane-live-custom image with correct CMD baked in.
#
# OPS-454: transient stop-the-bleed via oc patch. This manifest makes it durable.
#
# PLANE-RECOVERY SSA fix: ServerSideApply=true,Validate=false so ArgoCD skips
# K8s API validation (which requires containers[0].image on a full Deployment
# spec). Without Validate=false, ArgoCD rejects this partial manifest with
# "spec.template.spec.containers[0].image: Required value" even though SSA
# only needs the fields being patched. IgnoreExtraneous suppresses the
# RepeatedResourceWarning from this manifest appearing alongside the
# Helm-rendered copy of the same Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plane-web-wl
  namespace: plane
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true,Validate=false
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    backstage.io/component: plane
spec:
  selector:
    matchLabels:
      app.name: plane-plane-web
  template:
    metadata:
      labels:
        app.name: plane-plane-web
        app.kubernetes.io/name: plane-web
    spec:
      # OPS-767: enforce non-root execution.
      # node:18-alpine image contains node user uid=1000 (confirmed via oc exec).
      # Next.js standalone server reads /app at runtime only — no writes needed.
      # Port 3000 is non-privileged; no capability escalation required.
      # anyuid SCC remains (UID 1000 is outside namespace range 1000970000+);
      # the SCC annotation stays anyuid but the container runs as non-root UID 1000.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: plane-web
        # Required field so K8s API accepts the manifest as a valid Deployment.
        # Must match the Helm-rendered image so SSA field-merge sees identical
        # values from both Helm field-manager and this manifest's field-manager.
        # Note: image name is "plane-frontend" (not "plane-web") per chart.
        image: harbor.208.haist.farm/sentinel/plane-frontend@sha256:113a092171baa433aad8eb14992a21ef2b4f8e9fa389a204dd4139e09d9bdc68
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        command:
        - node
        args:
        - web/server.js
        # OPS-951: livenessProbe merged from plane-liveness-probes.yaml (amend-3)
        # Consolidated here to avoid kustomize duplicate-ID conflict (same
        # Deployment GVK+namespace+name declared in two resources).
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

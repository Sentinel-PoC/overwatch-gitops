---
# OPS-455: Durable CMD patch for plane-admin-wl
#
# Harbor-mirrored plane-admin:v0.24.0 has ENTRYPOINT=docker-entrypoint.sh
# and CMD=["node"] (bare, no script arg). The Next.js admin server requires
# CMD=["node","admin/server.js"] to start. Helm chart plane-ce 1.4.1 does not
# template command/args — it relies on image CMD entirely.
#
# Applied via ServerSideApply (separate field manager from Helm). Helm owns
# all other Deployment fields; this manifest owns only command + args.
#
# Script path verified: oc exec plane-admin-wl-* -- ls /app/admin/ → server.js present.
#
# PLANE-RECOVERY SSA fix: ServerSideApply=true,Validate=false so ArgoCD skips
# K8s API validation (which requires containers[0].image on a full Deployment
# spec). Without Validate=false, ArgoCD rejects this partial manifest with
# "spec.template.spec.containers[0].image: Required value" even though SSA
# only needs the fields being patched. IgnoreExtraneous suppresses the
# RepeatedResourceWarning from this manifest appearing alongside the
# Helm-rendered copy of the same Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plane-admin-wl
  namespace: plane
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true,Validate=false
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    backstage.io/component: plane
spec:
  selector:
    matchLabels:
      app.name: plane-plane-admin
  template:
    metadata:
      labels:
        app.name: plane-plane-admin
        app.kubernetes.io/name: plane-admin
    spec:
      # OPS-767: enforce non-root execution.
      # node:18-alpine image contains node user uid=1000 (confirmed via oc exec on peer images).
      # Next.js standalone server reads /app at runtime only — no writes needed.
      # Port 3000 is non-privileged; no capability escalation required.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: plane-admin
        # Required field so K8s API accepts the manifest as a valid Deployment.
        # Must match the Helm-rendered image so SSA field-merge sees identical
        # values from both Helm field-manager and this manifest's field-manager
        # (no field-ownership conflict). Update both if chart bumps versions.
        image: harbor.208.haist.farm/sentinel/plane-admin@sha256:228f9ca3af7235123f9706d04ffbccc1c9deb894c22ea39f8a9c2704d69f9678
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        command:
        - node
        args:
        - admin/server.js

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ops-wazuh-creds
  namespace: sentinel-ops
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ops-wazuh-creds
    creationPolicy: Owner
  data:
    - secretKey: WAZUH_USER
      remoteRef:
        key: wazuh/api
        property: username
    - secretKey: WAZUH_PASS
      remoteRef:
        key: wazuh/api
        property: password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ops-minio-creds
  namespace: sentinel-ops
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ops-minio-creds
    creationPolicy: Owner
  data:
    - secretKey: MINIO_ACCESS_KEY
      remoteRef:
        key: minio
        property: access_key
    - secretKey: MINIO_SECRET_KEY
      remoteRef:
        key: minio
        property: secret_key
    - secretKey: MINIO_ENDPOINT
      remoteRef:
        key: minio
        property: endpoint
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ops-forgejo-token
  namespace: sentinel-ops
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ops-forgejo-token
    creationPolicy: Owner
    template:
      data:
        FORGEJO_TOKEN: "{{ .forgejo_token }}"
        FORGEJO_URL: "https://forgejo.208.haist.farm"
  data:
    # SEC-83: switched from write-scoped sentinel-worker token to read-only forgejo-gitops-ro.
    # sentinel-ops compliance cronjob only does unauthenticated GET /api/v1/version; read scope sufficient.
    - secretKey: forgejo_token
      remoteRef:
        key: forgejo-gitops-ro
        property: api_token
---

---
# ops-plane-creds — Plane API key for etcd-backup-verify-bootstrap Job.
# Used ONLY by the one-shot bootstrap Job to post verification results and
# close OPS-183. The recurring verify CronJob does NOT use Plane API.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ops-plane-creds
  namespace: sentinel-ops
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ops-plane-creds
    creationPolicy: Owner
  data:
    - secretKey: PLANE_API_KEY
      remoteRef:
        key: plane/api-key
        property: api_key

apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-backup-verify
  namespace: sentinel-ops
  annotations:
    compliance.sentinel/controls: "CP-9,CP-9(1),CM-3(2)"
    compliance.sentinel/description: >
      Recurring verification of etcd backup integrity. Checks: snapshot
      freshness in primary MinIO (within 7h), Vault transit decrypt round-trip
      with bbolt magic-byte validation (CP-9(8)), replica presence and age
      (within 8h, CP-9(1)). Failure visibility via Job status in sentinel-ops
      namespace (Wazuh monitors this namespace). No Plane API calls — that is
      handled exclusively by the one-shot bootstrap Job.
spec:
  schedule: "30 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: etcd-backup-verify
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          serviceAccountName: etcd-backup-sa
          restartPolicy: Never
          containers:
            - name: verify
              image: harbor.208.haist.farm/sentinel/sentinel-ops@sha256:6e6e95aab482e99fdd0e4dafcdbabe9914c0ba8371799335052269a225d05fc6
              command: ["/bin/bash", "/opt/etcd-backup/etcd-backup-verify.sh"]
              env:
                - name: VAULT_ADDR
                  value: "https://vault.208.haist.farm"
                - name: VAULT_K8S_ROLE
                  value: "etcd-backup"
              envFrom:
                - secretRef:
                    name: ops-minio-creds
              volumeMounts:
                - name: scripts
                  mountPath: /opt/etcd-backup
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          volumes:
            - name: scripts
              configMap:
                name: etcd-backup-scripts
                defaultMode: 0755

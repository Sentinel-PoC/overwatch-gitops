---
# ServiceAccount for etcd backup CronJob.
# Uses ClusterIP etcd API (post OPS-183 refactor). No privileged SCC needed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: etcd-backup-sa
  namespace: sentinel-ops
  annotations:
    compliance.sentinel/controls: "CP-9,CP-9(8)"
    compliance.sentinel/description: >
      Dedicated SA for etcd-backup CronJob. Bound to Vault k8s auth role
      etcd-backup (policy: transit encrypt/decrypt etcd-backup key).
      Reads etcd TLS credentials from openshift-etcd via ClusterIP API access.
---
# ClusterRole granting read-only get on exactly the two named etcd credentials.
# Bound via RoleBinding in openshift-etcd — not cluster-wide.
# Verbs: get only. No list, watch, create, update, delete, patch.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: etcd-backup-etcd-reader
  annotations:
    compliance.sentinel/controls: "CP-9,CP-9(8)"
    compliance.sentinel/description: >
      Grants get-only access to named etcd credentials in openshift-etcd.
      Bound by a RoleBinding in openshift-etcd — not cluster-wide.
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["etcd-client"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["etcd-ca-bundle"]
    verbs: ["get"]
---
# RoleBinding in openshift-etcd namespace.
# Cross-namespace subject: SA in sentinel-ops; binding in openshift-etcd.
# This scopes the ClusterRole grant to openshift-etcd only — not cluster-wide.
#
# KUSTOMIZE NOTE: The parent kustomization.yaml sets namespace: sentinel-ops.
# The NamespaceTransformer will attempt to override this RoleBinding's namespace
# to sentinel-ops, which would be incorrect. A patch or separate overlay is
# required so this RoleBinding reaches openshift-etcd. See child issue OPS-249.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: etcd-backup-etcd-reader
  namespace: openshift-etcd
  annotations:
    compliance.sentinel/controls: "CP-9,CP-9(8)"
    compliance.sentinel/description: >
      Binds etcd-backup-etcd-reader to etcd-backup-sa (sentinel-ops).
      Intentionally in openshift-etcd to limit scope to that namespace only.
subjects:
  - kind: ServiceAccount
    name: etcd-backup-sa
    namespace: sentinel-ops
roleRef:
  kind: ClusterRole
  name: etcd-backup-etcd-reader
  apiGroup: rbac.authorization.k8s.io

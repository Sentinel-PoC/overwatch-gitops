apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: master
  name: 99-master-iscsid-timeout-tuning
spec:
  config:
    ignition:
      version: 3.2.0
    storage:
      files:
        - path: /etc/iscsi/iscsid.conf
          mode: 0600
          overwrite: true
          contents:
            # iscsid.conf tuned for iSCSI session recovery resilience (OPS-810)
            # Key changes vs stock RHCOS defaults:
            #   node.session.timeo.replacement_timeout = -1   (queue I/O indefinitely — OPS-164 fix; prevents session death during long TrueNAS reboots)
            #   node.conn[0].timeo.noop_out_interval = 10     (detect dead connection faster)
            #   node.conn[0].timeo.noop_out_timeout = 15      (fail dead connection faster)
            # Root cause: Langfuse XFS corruption 2026-05-14 — iSCSI session drop with
            # noop_out defaults (5s/5s) caused rapid silent failure before recovery.
            source: "data:text/plain;charset=utf-8;base64,"

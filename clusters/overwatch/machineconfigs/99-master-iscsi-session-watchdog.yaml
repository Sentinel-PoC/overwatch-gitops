apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: master
  name: 99-master-iscsi-session-watchdog
spec:
  config:
    ignition:
      version: 3.2.0
    storage:
      files:
        - path: /usr/local/bin/iscsi-session-watchdog
          mode: 0755
          overwrite: true
          contents:
            # iscsi-session-watchdog: polls iscsiadm every 30s; reconnects dropped
            # sessions before the 115s XFS journal flush timeout triggers
            # XFS_SHUTDOWN_LOG_IO_ERROR.  Max 3 auto-reconnects/hour before
            # throttling and emitting an ALERT to the journal (Loki/Wazuh pickup).
            source: "data:text/plain;charset=utf-8;base64,"
    systemd:
      units:
        - name: iscsi-session-watchdog.service
          enabled: true
          contents: |
            [Unit]
            Description=iSCSI session watchdog — auto-reconnect dropped sessions
            Documentation=https://plane.208.haist.farm (OPS-165)
            After=iscsid.service network-online.target
            Wants=network-online.target iscsid.service

            [Service]
            Type=simple
            ExecStart=/usr/local/bin/iscsi-session-watchdog
            Restart=always
            RestartSec=10

            [Install]
            WantedBy=multi-user.target

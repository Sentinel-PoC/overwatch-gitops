apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: haists-website-dev
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://forgejo.208.haist.farm/sentinel-admin/overwatch-gitops.git
    targetRevision: main
    path: apps/haists-website-dev
  destination:
    server: https://kubernetes.default.svc
    namespace: haists-website-dev
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[]?.remoteRef
        - .spec.target
        - .metadata.annotations["reconcile.external-secrets.io/trigger"]
    # SCC ignoreDifferences removed 2026-04-24 (SEC-33): haists-website-dev-anyuid
    # SCC manifest now declares all fields explicitly; no drift expected.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true

# OPS-747: NetworkPolicy baseline for demo namespace.
# demo namespace is empty (no pods as of 2026-05-18); policy applied preemptively
# so any future workload is covered immediately.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-netpol
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://forgejo.208.haist.farm/sentinel-admin/overwatch-gitops.git
    targetRevision: main
    path: apps/demo
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

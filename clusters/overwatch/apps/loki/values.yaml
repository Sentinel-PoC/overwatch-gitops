# Loki Helm values — OPS-391 / OPS-399
# Chart: grafana/loki 6.x (simple-scalable mode)
# Storage: MinIO at 192.168.12.58:9000, bucket loki-chunks
# Credentials: AWS SDK env var chain — ExternalSecret loki-minio-creds creates
#   AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY in the K8s Secret; extraEnvFrom
#   on each component injects them; Loki S3 client picks them up automatically
#   when access_key_id is absent from the rendered config (OPS-399 fix).
# Auth: disabled (single-tenant lab; Grafana handles access control)

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: s3
    s3:
      endpoint: http://192.168.12.58:9000
      region: us-east-1
      s3ForcePathStyle: true
      insecure: true
      # OPS-399: accessKeyId/secretAccessKey intentionally omitted.
      # When absent, Loki's AWS SDK S3 client uses the credential provider
      # chain and reads AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY from env.
      # These are injected via extraEnvFrom: secretRef: loki-minio-creds
      # (ExternalSecret → Vault secret/data/loki/minio-creds).
    bucketNames:
      chunks: loki-chunks
      ruler: loki-chunks
      admin: loki-chunks

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  limits_config:
    retention_period: 720h    # 30 days
    max_cache_freshness_per_query: 10m
    split_queries_by_interval: 15m
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32

  compactor:
    retention_enabled: true
    retention_delete_delay: 2h
    retention_delete_worker_count: 150
    delete_request_store: s3

  # OpenShift-compatible security context
  # anyuid SCC binding is in apps/loki/scc.yaml
  # OPS-397: seccompProfile removed — grafana/loki 6.30.1 translates it to
  # deprecated alpha annotations (seccomp.security.alpha.kubernetes.io/pod)
  # which OpenShift SCCs forbid. OpenShift enforces seccomp via SCC policy.
  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 10001
    runAsGroup: 10001
    runAsUser: 10001

  containerSecurityContext:
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    allowPrivilegeEscalation: false

# Deployment mode — simple scalable (separate read/write/backend pods)
deploymentMode: SimpleScalable

backend:
  replicas: 1
  # Load MinIO credentials from ESO-managed secret
  extraEnvFrom:
    - secretRef:
        name: loki-minio-creds
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

read:
  replicas: 1
  extraEnvFrom:
    - secretRef:
        name: loki-minio-creds
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

write:
  replicas: 2
  extraEnvFrom:
    - secretRef:
        name: loki-minio-creds
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Gateway — nginx ingress routing Loki read/write traffic
gateway:
  enabled: true
  replicas: 1
  # OPS-397: Override nginx resolver — chart defaults to kube-dns.kube-system
  # which does not exist on OpenShift. CoreDNS runs at openshift-dns.
  nginxConfig:
    resolver: dns-default.openshift-dns.svc.cluster.local.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Disable unused components
lokiCanary:
  enabled: false

test:
  enabled: false

chunksCache:
  enabled: false

resultsCache:
  enabled: false

# Self-monitoring disabled (lab environment)
monitoring:
  selfMonitoring:
    enabled: false
  serviceMonitor:
    enabled: false
  lokiCanary:
    enabled: false

# Fully-qualify the k8s-sidecar image used by loki-sc-rules container on backend pods.
# Chart default is `kiwigrid/k8s-sidecar:1.30.3` (no registry prefix).
# CRI-O 1.34 short_name_mode=enforcing rejects unqualified refs; adding docker.io/ prefix
# resolves unambiguously without changing the pulled image.
sidecar:
  image:
    repository: docker.io/kiwigrid/k8s-sidecar
